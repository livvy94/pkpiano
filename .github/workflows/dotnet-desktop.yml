name: Build Windows EXE

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Get source code
      - name: Checkout
        uses: actions/checkout@v5

      # Install MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Install NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # Restore NuGet packages
      - name: Restore
        run: nuget restore "PK Piano.sln"

      # Compile the application
      - name: Build
        run: msbuild "PK Piano/PK Piano.csproj" /p:Configuration=Release /p:Platform="AnyCPU" /m

      # Upload executable and required DLLs
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PK-Piano-Windows
          path: PK Piano/bin/Release/