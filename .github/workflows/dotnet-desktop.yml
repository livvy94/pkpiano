name: Build Windows EXE

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Download source code
      - name: Checkout
        uses: actions/checkout@v4

      # Install .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Restore dependencies
      - name: Restore
        run: dotnet restore "PK Piano.csproj"

      # Compile and publish standalone EXE
      - name: Publish Windows EXE
        run: >
          dotnet publish "PK Piano.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ./publish

      # Upload the finished EXE
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: ./publish/